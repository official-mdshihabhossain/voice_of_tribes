<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice of Tribes — Admin</title><link rel="stylesheet" href="../css/style.css"><style>body{background:#f3efe7}.admin{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#18352c;color:white;padding:24px;position:sticky;top:0;height:100vh}.side h2{font:700 25px Georgia,serif}.side button{display:block;width:100%;text-align:left;padding:11px;margin:5px 0;border:0;border-radius:10px;background:transparent;color:white;cursor:pointer}.side button.active,.side button:hover{background:rgba(255,255,255,.12)}.main{padding:35px}.panel{background:white;border:1px solid #ddd5c8;border-radius:18px;padding:22px;margin-bottom:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.status{padding:4px 8px;border-radius:99px;background:#edf3ef}.danger{color:#a33}.hidden{display:none}@media(max-width:800px){.admin{grid-template-columns:1fr}.side{position:relative;height:auto}.row{grid-template-columns:1fr}}</style></head><body><div class="admin"><aside class="side"><h2>Voice of Tribes</h2><p>Admin</p><button class="active" data-section="stories">Stories</button><button data-section="team">Team</button><button data-section="gallery">Gallery</button><a href="../" style="display:block;margin-top:25px">← Public site</a></aside><main class="main"><section id="stories" class="section-panel"><h1>Stories</h1><div class="panel"><h3>Create story</h3><form id="storyForm"><div class="row"><input name="title" placeholder="Title" required><input name="writer_name" placeholder="Writer name" required></div><input name="writer_location" placeholder="Writer location (optional)"><textarea name="body" placeholder="Story text" required></textarea><div class="row"><input name="image_url" placeholder="Image URL or Google Drive link"><input name="audio_url" placeholder="Audio URL or Google Drive link"></div><input name="video_url" placeholder="Video URL or Google Drive link"><select name="status"><option value="published">Publish now</option><option value="pending">Keep pending</option><option value="review">Review</option></select><button class="btn primary">Create story</button></form></div><div class="panel"><h3>Pending / existing stories</h3><div id="storyList">Login as admin to load.</div></div></section><section id="team" class="section-panel hidden"><h1>Team</h1><div class="panel"><form id="teamForm"><div class="row"><input name="name" placeholder="Name" required><input name="position" placeholder="Position" required></div><textarea name="bio" placeholder="Bio"></textarea><input name="photo_url" placeholder="Photo URL or Drive link"><button class="btn primary">Add member</button></form></div><div class="panel" id="teamList"></div></section><section id="gallery" class="section-panel hidden"><h1>Gallery</h1><div class="panel"><form id="galleryForm"><input name="title" placeholder="Title"><input name="image_url" placeholder="Image URL or Google Drive link" required><input name="caption" placeholder="Caption"><button class="btn primary">Add image</button></form></div><div class="panel" id="galleryList"></div></section></main></div><script src="../js/config.js"></script><script>
const API=(window.VT_CONFIG?.API_BASE_URL||'').replace(/\/$/,'');const api=async(p,o={})=>{const r=await fetch(API+p,{credentials:'include',headers:{'Content-Type':'application/json'},...o});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d};const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));document.querySelectorAll('.side button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.side button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.section-panel').forEach(s=>s.classList.add('hidden'));document.getElementById(b.dataset.section).classList.remove('hidden');if(b.dataset.section==='stories')stories();if(b.dataset.section==='team')team();if(b.dataset.section==='gallery')gallery()});document.getElementById('storyForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/stories',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();stories()}catch(x){alert(x.message)}};document.getElementById('teamForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/team',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();team()}catch(x){alert(x.message)}};document.getElementById('galleryForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/gallery',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();gallery()}catch(x){alert(x.message)}};async function stories(){try{const d=await api('/api/admin/stories');document.getElementById('storyList').innerHTML='<table class="table"><tr><th>Title</th><th>Writer</th><th>Status</th><th>Action</th></tr>'+d.results.map(s=>`<tr><td>${esc(s.title)}</td><td>${esc(s.writer_name)}</td><td><span class="status">${esc(s.status)}</span></td><td><select onchange="status('${s.id}',this.value)"><option ${s.status==='pending'?'selected':''}>pending</option><option ${s.status==='review'?'selected':''}>review</option><option ${s.status==='approved'?'selected':''}>approved</option><option ${s.status==='published'?'selected':''}>published</option><option ${s.status==='rejected'?'selected':''}>rejected</option></select></td></tr>`).join('')+'</table>'}catch(x){document.getElementById('storyList').innerHTML='<p>'+esc(x.message)+'</p>'}}async function status(id,status){try{await api('/api/admin/stories/'+id,{method:'PUT',body:JSON.stringify({status})});stories()}catch(x){alert(x.message)}}async function team(){try{const d=await api('/api/admin/team');document.getElementById('teamList').innerHTML=d.results.map(m=>`<p><b>${esc(m.name)}</b> — ${esc(m.position)} <button onclick="delTeam('${m.id}')">Delete</button></p>`).join('')}catch(x){document.getElementById('teamList').innerHTML='<p>'+esc(x.message)+'</p>'}}async function delTeam(id){await api('/api/admin/team/'+id,{method:'DELETE'});team()}async function gallery(){try{const d=await api('/api/admin/gallery');document.getElementById('galleryList').innerHTML=d.results.map(g=>`<p><b>${esc(g.title||'Image')}</b> <button onclick="delGallery('${g.id}')">Delete</button></p>`).join('')}catch(x){document.getElementById('galleryList').innerHTML='<p>'+esc(x.message)+'</p>'}}async function delGallery(id){await api('/api/admin/gallery/'+id,{method:'DELETE'});gallery()}stories();
</script></body></html>
